<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HM Coach</title>
  <meta name="description" content="Adaptiver Trainingsplan für den Berliner Halbmarathon mit Garmin-Auswertung.">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HM Coach">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="lock" class="lock hidden">
    <div class="card">
      <img class="logo" src="icon.svg" alt="">
      <h3>HM Coach</h3>
      <p class="hint">Deine Trainingsdaten sind verschlüsselt. Gib die Passphrase ein (Secret <code>COACH_PASSPHRASE</code>).</p>
      <form id="lock-form">
        <input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase">
        <label><input id="remember" type="checkbox" checked> Auf diesem Gerät merken</label>
        <button class="btn" type="submit">Entsperren</button>
        <div class="error" id="lock-error" role="alert"></div>
      </form>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="appbar">
      <div>
        <h1 id="title">HM Coach</h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="chip" id="countdown-chip"></span>
        <button class="icon-btn" id="refresh" aria-label="Aktualisieren" title="Aktualisieren">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="view active" id="view-today"></section>
      <section class="view" id="view-week"></section>
      <section class="view" id="view-plan"></section>
      <section class="view" id="view-analysis"></section>
      <section class="view" id="view-log"></section>
    </main>

    <nav class="tabbar" aria-label="Navigation">
      <button data-view="today" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Heute</button>
      <button data-view="week"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Woche</button>
      <button data-view="plan"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Plan</button>
      <button data-view="analysis"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 8-9"/><path d="M14 6h6v6"/></svg>Analyse</button>
      <button data-view="log"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></svg>Einheiten</button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
