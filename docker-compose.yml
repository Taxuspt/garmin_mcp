services:
  garmin-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garmin-mcp-server

    # Option 1: Use environment variables directly
    environment:
      - GARMIN_EMAIL=${GARMIN_EMAIL}
      - GARMIN_PASSWORD=${GARMIN_PASSWORD}
      # - GARMIN_IS_CN=true  # Uncomment to use Garmin Connect China (garmin.cn)

    # Option 2: Use file-based secrets (uncomment to use)
    # environment:
    #   - GARMIN_EMAIL_FILE=/run/secrets/garmin_email
    #   - GARMIN_PASSWORD_FILE=/run/secrets/garmin_password
    # secrets:
    #   - garmin_email
    #   - garmin_password

    # Mount volume to persist Garmin OAuth tokens
    volumes:
      - ./.garminconnect/:/root/.garminconnect

    # Restart policy
    restart: unless-stopped

    # Optional: Set stdin_open and tty for interactive MFA input
    stdin_open: true
    tty: true

  # Tooling — not started by `docker compose up`, run explicitly:
  #   docker compose run --rm test
  #   docker compose run --rm lint
  # Both build the `test` stage (the default/runtime image ships no
  # pytest/ruff) and bind-mount src/ (and tests/, for test), so edits take
  # effect without a rebuild and `ruff --fix` changes persist on the host
  # instead of dying with the container.
  test:
    build:
      context: .
      target: test
    profiles: ["tools"]
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    # Matches .github/workflows/ci.yml's scope: tests/e2e needs live Garmin
    # credentials/network and is deliberately excluded from both.
    entrypoint: ["python", "-m", "pytest", "tests/unit", "tests/integration", "-n", "auto", "-v"]

  lint:
    build:
      context: .
      target: test
    profiles: ["tools"]
    volumes:
      - ./src:/app/src
      - ./pyproject.toml:/app/pyproject.toml
    entrypoint: ["ruff", "check", "src"]

# Uncomment if using file-based secrets
# secrets:
#   garmin_email:
#     file: ./secrets/garmin_email.txt
#   garmin_password:
#     file: ./secrets/garmin_password.txt
