{{- if eq .Values.transport.mode "stdio" -}}
{{- fail "transport.mode=stdio is not supported by this chart (a pod has no stdin to attach to); use streamable-http or sse" -}}
{{- end -}}
{{- if and (include "garmin-mcp.tokenMode" .) (not .Values.persistence.enabled) -}}
{{- fail "garmin.tokens.* requires persistence.enabled=true: without a volume the token JSON would be passed inline via $GARMINTOKENS (logged at startup) and rotated refresh tokens would be lost on restart" -}}
{{- end -}}
{{- if and (default "" .Values.transport.httpToken | toString | trim) .Values.garmin.existingSecret -}}
{{- fail "transport.httpToken cannot be combined with garmin.existingSecret (the chart Secret is not rendered); add a GARMIN_MCP_HTTP_TOKEN key to that Secret instead" -}}
{{- end -}}
{{- if and .Values.transport.stateless (ne .Values.transport.mode "streamable-http") -}}
{{- fail "transport.stateless=true only applies to transport.mode=streamable-http (the server ignores it for sse)" -}}
{{- end -}}
{{- $http := ne .Values.transport.mode "stdio" -}}
{{- /* PVC-backed token store (directory mode) whenever persistence is on. It is
       seeded once from the Secret by the init container below, then the app
       persists each rotated token back to it, so the rotating refresh-token
       chain survives restarts and scale-to-zero. */}}
{{- $usePvc := .Values.persistence.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garmin-mcp.fullname" . }}
  labels:
    {{- include "garmin-mcp.labels" . | nindent 4 }}
spec:
  # Keep at 1: the token PVC is RWO and per-pod, and the refresh token rotates,
  # so replicas would race on it. transport.stateless removes the HTTP session
  # affinity but not that; scaling >1 would also need shared token storage.
  replicas: {{ .Values.replicaCount }}
  strategy:
    # Single RWO volume: avoid two pods mounting it during rollouts.
    type: Recreate
  selector:
    matchLabels:
      {{- include "garmin-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "garmin-mcp.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $usePvc }}
      initContainers:
        # Seed the token volume from the Secret on FIRST boot only. If the PVC
        # already holds garmin_tokens.json (a token the running app rotated), we
        # keep it — that is what lets the rotating refresh token survive cold
        # starts. In credentials mode there is no seed key, so this is a no-op and
        # the app logs in and writes the volume itself.
        - name: seed-tokens
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-c"]
          args:
            - |
              import os
              d = os.environ["MOUNT"]
              p = os.path.join(d, "garmin_tokens.json")
              seed = os.environ.get("GARMINTOKENS_SEED")
              if os.path.exists(p):
                  print("token store present; keeping rotated token", flush=True)
              elif seed:
                  os.makedirs(d, exist_ok=True)
                  # Owner-only: the app only hardens the dir on the fresh-credentials
                  # path, so a seeded file keeps whatever mode it was created with.
                  with open(os.open(p, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), "w") as f:
                      f.write(seed)
                  print("seeded token store from Secret", flush=True)
              else:
                  print("no seed and no token on volume; interactive auth required", flush=True)
          env:
            - name: MOUNT
              value: {{ .Values.persistence.mountPath | quote }}
            - name: GARMINTOKENS_SEED
              valueFrom:
                secretKeyRef:
                  name: {{ include "garmin-mcp.secretName" . }}
                  key: GARMINTOKENS
                  optional: true
          volumeMounts:
            - name: tokens
              mountPath: {{ .Values.persistence.mountPath }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: GARMIN_MCP_TRANSPORT
              value: {{ .Values.transport.mode | quote }}
            {{- if $http }}
            - name: GARMIN_MCP_HOST
              value: {{ .Values.transport.host | quote }}
            - name: GARMIN_MCP_PORT
              value: {{ .Values.transport.port | quote }}
            {{- if .Values.transport.stateless }}
            - name: GARMIN_MCP_STATELESS_HTTP
              value: "true"
            {{- end }}
            {{- end }}
            {{- if .Values.garmin.isCn }}
            - name: GARMIN_IS_CN
              value: "true"
            {{- end }}
            {{- if $usePvc }}
            - name: GARMINTOKENS
              value: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "garmin-mcp.secretName" . }}
          {{- if $http }}
          ports:
            - name: http
              containerPort: {{ .Values.transport.port }}
          {{- if .Values.probes.enabled }}
          # startupProbe polls /healthz every startupPeriodSeconds and gates
          # readiness/liveness until it passes, i.e. as soon as the HTTP server
          # is listening (Garmin login runs in the background). Readiness then
          # follows probes.readinessPath: /readyz waits for login, /healthz is
          # Ready immediately. Lower the interval where fast cold starts matter.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.startupPeriodSeconds }}
            failureThreshold: {{ .Values.probes.startupFailureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath | default "/readyz" }}
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if $usePvc }}
          volumeMounts:
            - name: tokens
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if $usePvc }}
      volumes:
        - name: tokens
          persistentVolumeClaim:
            claimName: {{ include "garmin-mcp.pvcName" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
