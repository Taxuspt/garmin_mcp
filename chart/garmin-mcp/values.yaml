replicaCount: 1

image:
  repository: ghcr.io/taxuspt/garmin_mcp
  # Defaults to the chart's appVersion when empty; override with a release tag.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- Garmin Connect authentication ------------------------------------------
# Choose ONE of three ways to authenticate (token mode wins if several are set):
#
#   A. Pre-generated tokens (RECOMMENDED for 2FA / not pushing credentials).
#      Run `garmin-mcp-auth` locally once, then point the chart at the result.
#      The token JSON is stored in a Secret and passed as $GARMINTOKENS; no
#      email/password ever reaches the cluster, and MFA is handled at auth time.
#        tokens.json   - contents of ~/.garminconnect/garmin_tokens.json
#        tokens.base64 - contents of ~/.garminconnect_base64 (decoded by the chart)
#      Easiest, paste nothing:
#        helm install garmin chart/garmin-mcp \
#          --set-file garmin.tokens.json=$HOME/.garminconnect/garmin_tokens.json
#
#   B. Credentials. The chart creates a Secret from email/password. Only works
#      if the account has NO MFA (the pod cannot answer an MFA prompt).
#      NOTE: values.yaml is usually committed — keep real creds in a separate
#      untracked file passed with `-f`, or use existingSecret.
#
#   C. existingSecret. A Secret you manage (sealed-secrets, external-secrets…).
#      It must contain GARMIN_EMAIL/GARMIN_PASSWORD, or GARMINTOKENS (token JSON).
#      Every key is loaded into the container env, so add GARMIN_MCP_HTTP_TOKEN
#      to it to enable bearer auth (transport.httpToken is rejected here).
garmin:
  # --- option A: tokens ---
  tokens:
    json: ""
    base64: ""
  # --- option B: credentials ---
  email: ""
  password: ""
  # --- option C: bring your own Secret ---
  existingSecret: ""
  # Use Garmin Connect China (garmin.cn) instead of the international service.
  isCn: false

# --- Transport --------------------------------------------------------------
# streamable-http (default) serves MCP at /mcp; sse serves /sse + /messages/.
# stdio is rejected: a pod has no stdin for an MCP client to attach to.
transport:
  mode: streamable-http # streamable-http | sse
  host: "0.0.0.0"
  port: 8000
  # Shared secret for bearer auth: when set, /mcp, /sse and /messages/ require
  # `Authorization: Bearer <token>` (401 otherwise); /healthz and /readyz stay
  # open for probes. Stored in the chart Secret as GARMIN_MCP_HTTP_TOKEN, never
  # as a plain env value. Keep real tokens out of committed values files (pass
  # with --set or an untracked `-f` file). With garmin.existingSecret, put the
  # GARMIN_MCP_HTTP_TOKEN key in that Secret instead; setting both fails.
  # Generate one with: openssl rand -hex 32
  httpToken: ""
  # Run streamable-http without MCP sessions (GARMIN_MCP_STATELESS_HTTP=true).
  # Avoids "404 Session not found" on the first call after 30 min idle, which
  # some clients (e.g. claude.ai connectors) report as a failed tool call. No
  # tool relies on session state. streamable-http only; rejected with sse.
  stateless: false

# --- Token persistence ------------------------------------------------------
# Garmin's DI refresh token ROTATES on every refresh, so the live token must be
# stored somewhere that survives a pod restart — otherwise a cold start replays a
# stale, already-invalidated token and login fails. When enabled, a PVC is mounted
# at mountPath and $GARMINTOKENS points at it (directory mode), so the app writes
# each rotated token back. On first boot an init container seeds the volume from
# the Secret (tokens.json/base64 or existingSecret's GARMINTOKENS); later boots
# keep the rotated token already on the PVC. In credentials mode the app logs in
# and writes the volume itself. Keep this on: token mode (tokens.json/base64)
# refuses to render without it, since the inline fallback logs the token JSON at
# startup and loses every rotation on restart.
persistence:
  enabled: true
  size: 64Mi
  accessModes:
    - ReadWriteOnce
  storageClass: ""
  # Mount an existing PVC instead of creating one.
  existingClaim: ""
  mountPath: /root/.garminconnect

service:
  type: ClusterIP
  port: 8000

# The app's only built-in auth is the optional bearer token (transport.httpToken).
# Without it, auth must be enforced in front of the chart (e.g. Authelia
# forwardAuth, as below).
ingress:
  enabled: false
  className: nginx
  host: garmin-mcp.example.com
  # Matches transport.mode=streamable-http. For sse set path: / (it needs both
  # /sse and /messages/).
  path: /mcp
  pathType: Prefix
  annotations: {}
  # Example Authelia forwardAuth annotations (ingress-nginx):
  #   nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/authz/forward-auth"
  #   nginx.ingress.kubernetes.io/auth-signin: "https://auth.example.com?rm=$request_method"
  #   nginx.ingress.kubernetes.io/auth-response-headers: "Remote-User,Remote-Name,Remote-Email,Remote-Groups"
  tls: []
  # - secretName: garmin-mcp-tls
  #   hosts:
  #     - garmin-mcp.example.com

# Startup and liveness probes hit /healthz, which answers 200 as soon as the
# HTTP server is up (Garmin login runs in a background thread and does not block
# it). Readiness hits readinessPath. Probes are unauthenticated even with
# transport.httpToken set. The startup probe polls every startupPeriodSeconds
# and hands over to readiness/liveness on its first 200.
probes:
  enabled: true
  # Poll interval while the app is starting.
  startupPeriodSeconds: 10
  # Max startup attempts before the pod is declared failed (~startupPeriodSeconds
  # * this seconds). Covers Python import + binding the HTTP server.
  startupFailureThreshold: 3
  # /readyz returns 200 only once Garmin login succeeded (503 while pending or
  # after a failure), so no traffic reaches the pod before tool calls can work.
  # A pod whose login failed stays NotReady but is NOT restarted (liveness is
  # /healthz); fix the tokens and restart it. Set /healthz for scale-to-zero
  # setups (e.g. KEDA HTTP add-on) where the pod must go Ready immediately and
  # the first tool call waits on the login instead. /readyz needs an image that
  # serves it; set /healthz when pinning an older image.tag without it.
  readinessPath: /readyz

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Extra environment variables passed verbatim to the container, e.g.
# GARMIN_TOOL_PROFILE (built-in tool subset), GARMIN_DISABLED_TOOLS or
# GARMIN_MCP_CALL_TIMEOUT (per-call Garmin timeout, default 90s, 0 disables).
# Do not put secrets here; use transport.httpToken or garmin.existingSecret.
extraEnv: []
# - name: GARMIN_DISABLED_TOOLS
#   value: "upload_workout,delete_workout"

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
